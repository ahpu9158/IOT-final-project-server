services:
  influxdb:
    image: influxdb:2.7
    restart: unless-stopped
    ports: ["8086:8086"]          # InfluxDB UI at http://localhost:8086 (optional)
    volumes: ["./data/influx:/var/lib/influxdb2"]
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_PASS}
      DOCKER_INFLUXDB_INIT_ORG: cedt
      DOCKER_INFLUXDB_INIT_BUCKET: desk_raw
      DOCKER_INFLUXDB_INIT_RETENTION: 30d
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN}
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 5s
      retries: 20

  api:
    build: ./api
    restart: unless-stopped
    ports: ["${PORT:-8000}:8000"]
    volumes: ["./data/app:/data"]   # SQLite: sessions and log
    environment:
      DEVICE_TOKEN: ${DEVICE_TOKEN}
      INFLUX_URL: http://influxdb:8086
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      INFLUX_ORG: cedt
      INFLUX_BUCKET: desk_raw
      INFLUX_BUCKET_1M: desk_1m
      SQLITE_PATH: /data/app.db
      TZ: Asia/Bangkok
    depends_on:
      influxdb: {condition: service_healthy}
